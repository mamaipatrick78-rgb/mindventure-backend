name: Trading cycle

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger trading cycle
        run: |
          curl -sS -f -w "\nHTTP_STATUS:%{http_code}\n" -X POST https://mindventure-backend-fuu4.onrender.com/api/trading/run-cycle \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
